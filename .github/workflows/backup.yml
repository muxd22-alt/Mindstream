name: Backup D1

# Weekly logical backup of the whole database as SQL. Download the artifact from
# the run page, or restore it with the Restore workflow.

on:
  schedule:
    - cron: '0 1 * * 0' # Sundays 04:00 Riyadh
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Resolve D1 id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/resolve-d1.mjs

      - name: Export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backup
          npx wrangler d1 export council --remote --output "backup/council-$(date -u +%Y%m%d-%H%M).sql"
          ls -lh backup

      - uses: actions/upload-artifact@v4
        with:
          name: council-d1-backup
          path: backup/*.sql
          retention-days: 90

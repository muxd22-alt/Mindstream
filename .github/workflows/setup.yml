name: Setup

# Everything you need to do from the phone, in one workflow.
# Run it from GitHub mobile → Actions → Setup → Run workflow.
#
#   mode = full      create schema, push secrets, deploy, seed personas, set webhook
#   mode = migrate   apply D1 migrations only
#   mode = secrets   push repository secrets to the Worker only
#   mode = seed      sync personas/*.yaml into D1 only
#   mode = telegram  set webhook + menu button only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: full
        options: [full, migrate, secrets, seed, telegram]
      force_seed:
        description: 'Overwrite existing seed personas'
        type: boolean
        default: false

concurrency:
  group: setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check GitHub secrets/variables
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_TELEGRAM_USER_ID: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node scripts/check-secrets.mjs

      - name: Resolve D1 id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/resolve-d1.mjs

      - name: Apply database migrations
        if: ${{ inputs.mode == 'full' || inputs.mode == 'migrate' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply council --remote

      - name: Push secrets to the Worker
        if: ${{ inputs.mode == 'full' || inputs.mode == 'secrets' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ALLOWED_TELEGRAM_USER_ID: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const keys = ["TELEGRAM_BOT_TOKEN","OPENROUTER_API_KEY","CF_ACCOUNT_ID","CF_API_TOKEN",
              "ALLOWED_TELEGRAM_USER_ID","INTERNAL_TOKEN","PUBLIC_BASE_URL","TELEGRAM_WEBHOOK_SECRET",
              "RSSHUB_URL","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","GOOGLE_REFRESH_TOKEN","GOOGLE_DRIVE_FOLDER_ID"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            if (!out.CF_ACCOUNT_ID && process.env.CLOUDFLARE_ACCOUNT_ID) out.CF_ACCOUNT_ID = process.env.CLOUDFLARE_ACCOUNT_ID;
            require("fs").writeFileSync(".secrets.json", JSON.stringify(out));
            console.log("pushing:", Object.keys(out).join(", "));
            const required = ["TELEGRAM_BOT_TOKEN","OPENROUTER_API_KEY","ALLOWED_TELEGRAM_USER_ID","INTERNAL_TOKEN","PUBLIC_BASE_URL"];
            const missing = required.filter((k) => !out[k]);
            if (missing.length) { console.error("MISSING SECRETS:", missing.join(", ")); process.exit(1); }
          '
          npx wrangler secret bulk .secrets.json
          rm -f .secrets.json

      - name: Build + deploy (needed before seeding)
        if: ${{ inputs.mode == 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run web:build
          npm run assets
          npx wrangler deploy

      - name: Seed personas
        if: ${{ inputs.mode == 'full' || inputs.mode == 'seed' }}
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          FORCE: ${{ inputs.force_seed }}
        run: |
          if [ "$FORCE" = "true" ]; then BODY='{"force":true}'; else BODY='{}'; fi
          node scripts/call.mjs /internal/seed "$BODY"

      - name: Set Telegram webhook + menu button
        if: ${{ inputs.mode == 'full' || inputs.mode == 'telegram' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: node scripts/set-webhook.mjs
